<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI - Forgot Password</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.card{max-width:560px;margin:10vh auto;background:#181820;border:1px solid #333;border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.logo{font-size:34px;font-weight:bold;color:#ff5c9a;margin-bottom:8px}.input{width:100%;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:13px;margin:6px 0 16px}button{width:100%;background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:13px;font-size:17px;cursor:pointer}.secondary{background:#444;margin-top:10px}.message{margin-top:14px;color:#bbb}.error{color:#ff7777;margin-top:12px}.small{color:#aaa;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<div class="logo">AI</div>
<h1>Forgot Password</h1>
<p>Enter the email address for your account and we'll send you a password reset link.</p>
<h3>Email</h3>
<input id="email" class="input" type="email" autocomplete="email">
<button onclick="sendReset()">Send Reset Link</button>
<button class="secondary" onclick="location.href='login.html'">Back to Login</button>
<div id="error" class="error"></div>
<div id="message" class="message"></div>
<p class="small">For security, the same confirmation is shown whether or not an account exists.</p>
</div>
<script>
async function sendReset(){
 const error=document.getElementById('error'),message=document.getElementById('message');
 error.textContent='';message.textContent='';
 const email=document.getElementById('email').value.trim();
 if(!email){error.textContent='Enter your email address.';return}
 try{
  const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const j=await r.json();
  if(!r.ok)throw Error(j.error||'Unable to send reset link.');
  message.textContent=j.message||'If that email belongs to an account, a reset link has been sent.';
 }catch(e){error.textContent=e.message}
}
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')sendReset()});
</script>
</body>
</html>
