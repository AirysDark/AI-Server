<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI - Login</title><style>*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.card{max-width:560px;margin:10vh auto;background:#181820;border:1px solid #333;border-radius:18px;padding:24px}.logo{font-size:34px;font-weight:bold;color:#ff5c9a;margin-bottom:8px}.input{width:100%;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:13px;margin:6px 0 16px}button{width:100%;background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:13px;font-size:17px;cursor:pointer}.secondary{background:#444;margin-top:10px}.error{color:#ff7777;margin-top:12px}.small{color:#aaa;font-size:13px}</style></head><body><div class="card"><div class="logo">AI</div><h1>Login</h1><p>Sign in to your personal AI account.</p><h3>Email</h3><input id="email" class="input" type="email" autocomplete="email"><h3>Password</h3><input id="password" class="input" type="password" autocomplete="current-password"><button onclick="login()">Login</button><button class="secondary" onclick="location.href='register.html'">Create Account</button><div id="error" class="error"></div><p class="small">One account can contain up to 3 separate AIs.</p></div><script>
async function login(){let e=document.getElementById('error');e.textContent='';try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});let j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');let ais=Array.isArray(j.ais)?j.ais:[];let complete=ais.some(a=>a.setup_complete===true);location.href=complete?'select_ai.html':'setup.html'}catch(x){e.textContent=x.message}}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
(async()=>{try{let r=await fetch('/api/auth/me');let j=await r.json();if(j.authenticated){location.href='select_ai.html'}}catch(e){}})();
</script></body></html>
