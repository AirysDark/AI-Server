<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI - Register</title><style>*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.card{max-width:560px;margin:8vh auto;background:#181820;border:1px solid #333;border-radius:18px;padding:24px}.logo{font-size:34px;font-weight:bold;color:#ff5c9a}.input{width:100%;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:13px;margin:6px 0 16px}button{width:100%;background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:13px;font-size:17px;cursor:pointer}.secondary{background:#444;margin-top:10px}.error{color:#ff7777;margin-top:12px}.small{color:#aaa;font-size:13px}</style></head><body><div class="card"><div class="logo">AI</div><h1>Create Account</h1><p>Your account can contain up to 3 separate AIs, each with its own memory and settings.</p><h3>Username</h3><input id="username" class="input" maxlength="40" autocomplete="username"><h3>Email</h3><input id="email" class="input" type="email" autocomplete="email"><h3>Password</h3><input id="password" class="input" type="password" minlength="8" autocomplete="new-password"><p class="small">Use at least 8 characters.</p><button onclick="register()">Create Account</button><button class="secondary" onclick="location.href='login.html'">Back to Login</button><div id="error" class="error"></div></div><script>
async function register(){let e=document.getElementById('error');e.textContent='';let username=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!username){e.textContent='Enter a username.';return}if(password.length<8){e.textContent='Password must be at least 8 characters.';return}try{let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})});let j=await r.json();if(!r.ok)throw Error(j.error||'Registration failed');location.href='setup.html'}catch(x){e.textContent=x.message}}
(async()=>{try{let r=await fetch('/api/auth/me');let j=await r.json();if(j.authenticated)location.href='select_ai.html'}catch(e){}})();
</script></body></html>
