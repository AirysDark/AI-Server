<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Server Errors</title>
<style>
body{margin:0;background:#101014;color:#eee;font:15px Arial;padding:16px}.wrap{max-width:1200px;margin:auto}.card{background:#181820;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 13px;background:#ff5c9a;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#444}.danger{background:#a33}.muted{color:#aaa}.ok{color:#62e39b}.err{color:#ff7272}.stat{display:inline-block;background:#222;border-radius:10px;padding:12px 16px;margin:4px}.log{background:#0b0b0f;border:1px solid #333;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font:13px monospace;max-height:55vh;overflow:auto}.empty{padding:20px;text-align:center;color:#62e39b}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1 style="margin-top:0">AI Server Errors</h1>
<p class="muted">Only application errors and HTTP 4xx/5xx errors are shown here.</p>
<div class="actions"><button class="secondary" onclick="location.href='/admin'">Back to Admin</button><button onclick="loadErrors()">Refresh</button></div>
</div>
<div id="status" class="card">Loading errors…</div>
<div class="card"><h2>Application Errors</h2><div id="application" class="log"></div></div>
<div class="card"><h2>HTTP Errors</h2><div id="http" class="log"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadErrors(){
 try{
  const r=await fetch('/api/admin/errors',{credentials:'same-origin',cache:'no-store'});
  if(r.status===401){location.href='/admin';return}
  const d=await r.json();
  if(!r.ok)throw Error(d.error||('HTTP '+r.status));
  $('status').innerHTML='<span class="stat"><b>Application errors:</b> '+d.application_count+'</span><span class="stat"><b>HTTP errors:</b> '+d.http_count+'</span><div class="muted" style="margin-top:10px">Showing the most recent error entries.</div>';
  $('application').innerHTML=d.application_errors.length?d.application_errors.map(esc).join('\n'):'<div class="empty">No application errors recorded.</div>';
  $('http').innerHTML=d.http_errors.length?d.http_errors.map(esc).join('\n'):'<div class="empty">No HTTP 4xx/5xx errors recorded.</div>';
 }catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
}
loadErrors();
</script>
</body>
</html>
