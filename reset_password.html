<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI - Reset Password</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.card{max-width:560px;margin:10vh auto;background:#181820;border:1px solid #333;border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.logo{font-size:34px;font-weight:bold;color:#ff5c9a;margin-bottom:8px}.input{width:100%;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:13px;margin:6px 0 16px}button{width:100%;background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:13px;font-size:17px;cursor:pointer}.secondary{background:#444;margin-top:10px}.error{color:#ff7777;margin-top:12px}.message{color:#aaa;margin-top:12px}.small{color:#aaa;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<div class="logo">AI</div>
<h1>Reset Password</h1>
<p>Choose a new password for your account.</p>
<h3>New Password</h3>
<input id="password" class="input" type="password" minlength="8" autocomplete="new-password">
<h3>Confirm New Password</h3>
<input id="confirm" class="input" type="password" minlength="8" autocomplete="new-password">
<p class="small">Use at least 8 characters. Both password fields must match.</p>
<button onclick="resetPassword()">Change Password</button>
<button class="secondary" onclick="location.href='login.html'">Back to Login</button>
<div id="error" class="error"></div><div id="message" class="message"></div>
</div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
async function resetPassword(){
 const error=document.getElementById('error'),message=document.getElementById('message');error.textContent='';message.textContent='';
 const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(!token){error.textContent='This reset link is missing its token.';return}
 if(password.length<8){error.textContent='Password must be at least 8 characters.';return}
 if(password!==confirm){error.textContent='The passwords do not match.';return}
 try{
  const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password,confirm_password:confirm})});
  const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to change password.');
  message.textContent='Password changed successfully. Redirecting to login...';
  setTimeout(()=>location.href='login.html',1200);
 }catch(e){error.textContent=e.message}
}
</script>
</body>
</html>
