<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gene MMD Viewer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:Segoe UI,Arial,sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none}
#panel{position:fixed;z-index:10;top:12px;left:12px;width:min(420px,calc(100vw - 24px));padding:14px;background:rgba(15,15,18,.9);border:1px solid #444;border-radius:10px;box-sizing:border-box;backdrop-filter:blur(8px)}
#panel h1{font-size:18px;margin:0 0 8px}#status{font-size:13px;color:#bbb;margin:8px 0;white-space:pre-wrap}
button,input{font:inherit}button{padding:8px 12px;margin:3px;border:1px solid #555;border-radius:6px;background:#25252b;color:#eee;cursor:pointer}button:hover{background:#33333b}
input[type=text]{width:100%;box-sizing:border-box;padding:8px;background:#18181c;color:#eee;border:1px solid #555;border-radius:6px}
.small{font-size:12px;color:#888}.ok{color:#8bd49c}.err{color:#ff8d8d}
</style>
</head>
<body>
<div id="panel">
<h1>Gene — Babylon-MMD renderer</h1>
<input id="url" type="text" value="jene_PSO2.pmx" aria-label="PMX URL">
<div><button id="loadUrl">Load PMX URL</button><button id="pickFolder">Load PMX folder</button></div>
<input id="folder" type="file" webkitdirectory directory multiple hidden>
<div id="status">Initialising Babylon-MMD…</div>
<div class="small">For local models with textures, use “Load PMX folder”. It registers the PMX and all referenced texture files with Babylon's file loader.</div>
</div>
<canvas id="renderCanvas"></canvas>
<script type="module">
import {
  Engine, Scene, Vector3, Color3, HemisphericLight, DirectionalLight,
  ArcRotateCamera, LoadAssetContainerAsync, FilesInputStore
} from "https://esm.sh/@babylonjs/core@9.15.0";
import {
  MmdRuntime, MmdStandardMaterialProxy, SdefInjector
} from "https://esm.sh/babylon-mmd@1.3.0?deps=@babylonjs/core@9.15.0";
import "https://esm.sh/babylon-mmd@1.3.0/esm/Loader/pmxLoader?deps=@babylonjs/core@9.15.0";
import "https://esm.sh/babylon-mmd@1.3.0/esm/Loader/mmdModelLoader.default?deps=@babylonjs/core@9.15.0";

const canvas=document.getElementById('renderCanvas');
const status=document.getElementById('status');
const engine=new Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
SdefInjector.OverrideEngineCreateEffect(engine);
const scene=new Scene(engine);
scene.clearColor=new Color3(0.055,0.055,0.07).toColor4(1);
scene.ambientColor=new Color3(.5,.5,.5);

const camera=new ArcRotateCamera('GeneCamera',-Math.PI/2,Math.PI/2.15,28,new Vector3(0,10,0),scene);
camera.lowerRadiusLimit=1; camera.upperRadiusLimit=200; camera.wheelPrecision=35; camera.panningSensibility=80;
camera.attachControl(canvas,true);
new HemisphericLight('Hemi',new Vector3(0,1,0),scene).intensity=.65;
const sun=new DirectionalLight('Sun',new Vector3(.3,-1,.5),scene); sun.intensity=1.0;
const runtime=new MmdRuntime(scene); runtime.register(scene);
let container=null;

function setStatus(text,kind=''){status.textContent=text;status.className=kind;}
function fitCamera(){
  const ext=scene.getWorldExtends();
  const min=ext.min,max=ext.max;
  const center=min.add(max).scale(.5);
  const size=max.subtract(min);
  const radius=Math.max(size.x,size.y,size.z)*1.25;
  camera.target=center; camera.radius=Math.max(radius*1.8,2);
}

async function loadModel(source,displayName){
  try{
    if(container){container.removeAllFromScene();container.dispose();container=null;}
    setStatus('Loading '+displayName+' with Babylon-MMD…');
    container=await LoadAssetContainerAsync(source,scene);
    container.addAllToScene();
    const mmdMesh=container.meshes.find(m=>m.metadata?.mmdMesh || m.name.toLowerCase().includes('mmd')) || container.meshes[0];
    if(mmdMesh){
      try{runtime.createMmdModel(mmdMesh,{materialProxyConstructor:MmdStandardMaterialProxy});}catch(e){console.warn('MMD runtime model setup:',e);}
    }
    fitCamera();
    const meshes=container.meshes.length;
    const materials=container.materials.length;
    setStatus('Loaded successfully\nModel: '+displayName+'\nMeshes: '+meshes+'\nMaterials: '+materials,'ok');
  }catch(e){
    console.error(e);
    setStatus('LOAD FAILED\n'+(e?.message||String(e)),'err');
  }
}

document.getElementById('loadUrl').onclick=()=>loadModel(document.getElementById('url').value.trim(),document.getElementById('url').value.trim());
document.getElementById('pickFolder').onclick=()=>document.getElementById('folder').click();
document.getElementById('folder').onchange=async ev=>{
  const files=[...ev.target.files];
  if(!files.length)return;
  for(const file of files){
    const path=(file.webkitRelativePath||file.name).replace(/\\/g,'/').toLowerCase();
    FilesInputStore.FilesToLoad[path]=file;
    FilesInputStore.FilesToLoad[file.name.toLowerCase()]=file;
  }
  const pmx=files.find(f=>/\.pmx$/i.test(f.name)) || files.find(f=>/\.pmd$/i.test(f.name));
  if(!pmx){setStatus('No PMX/PMD file found in selected folder.','err');return;}
  await loadModel('file:',pmx.name);
};

engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
loadModel(document.getElementById('url').value,'jene_PSO2.pmx');
</script>
</body>
</html>
