<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI - Select AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}
.wrap{max-width:700px;margin:5vh auto}
.card{background:#181820;border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:12px}
.logo{font-size:32px;font-weight:bold;color:#ff5c9a}
.ai-list{display:grid;gap:12px;margin-bottom:20px}
.ai-card{display:grid;grid-template-columns:72px minmax(0,1fr) 124px;align-items:center;gap:14px;background:#111118;border:1px solid #333;border-radius:14px;padding:14px;min-height:100px}
.avatar{width:72px;height:72px;min-width:72px;border-radius:50%;object-fit:cover;border:3px solid #ff77aa}
.info{min-width:0;overflow:hidden}
.name{font-size:20px;font-weight:bold;line-height:1.15;overflow-wrap:anywhere}
.small{color:#aaa;font-size:13px;margin-top:5px;line-height:1.3;overflow-wrap:anywhere}
.active{border-color:#ff5c9a}
.ai-actions{display:flex;flex-direction:column;gap:8px;width:124px;justify-self:end}
.ai-actions button{width:100%;min-width:0}
button{background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-size:15px}
button:disabled{opacity:.65;cursor:not-allowed}
button.secondary{background:#444}
button.danger{background:#7a3333}
.main-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.main-actions button{flex:1;min-width:120px}
.download-section{max-width:700px;margin:18px auto 0;padding:0 18px 18px;text-align:center}
.download{display:block;width:100%;background:#333;border:1px solid #555;text-align:center;text-decoration:none;color:#fff;border-radius:10px;padding:13px 15px;font-size:15px}
.download:hover{background:#444}
.error{color:#ff7777;margin-top:12px}
.empty{color:#aaa;text-align:center;padding:20px}
@media(max-width:430px){
.ai-card{grid-template-columns:64px minmax(0,1fr) 108px;gap:10px;padding:12px}
.avatar{width:64px;height:64px;min-width:64px}
.ai-actions{width:108px}
.ai-actions button{padding:10px 8px;font-size:14px}
.name{font-size:18px}
.small{font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">AI</div>
    <h1>Select your AI</h1>
    <p class="small">Your account can have up to 3 separate AIs. Each AI keeps its own settings, personality, photos, memory and conversation history.</p>

    <div id="list" class="ai-list"></div>

    <div class="main-actions">
      <button id="create" onclick="createAI()">+ Create New AI</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <div id="error" class="error"></div>
  </div>
</div>

<!-- Android download is intentionally the last thing on the page. -->
<div class="download-section">
  <a class="download" href="/Apk/app-debug.apk" download>Download Android App</a>
</div>

<script>
const $ = id => document.getElementById(id);
let max = 3;

async function request(path, body) {
    const r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(body || {})
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(j.error || ("Request failed (" + r.status + ")"));
    return j;
}

async function load() {
    try {
        const me = await (await fetch("/api/auth/me", {credentials:"same-origin"})).json();
        if (!me.authenticated) {
            location.href = "login.html";
            return;
        }

        const r = await fetch("/api/ais", {credentials:"same-origin"});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not load AIs");

        max = j.max || 3;
        const list = $("list");
        list.innerHTML = "";

        if (!Array.isArray(j.ais) || j.ais.length === 0) {
            list.innerHTML = '<div class="empty">No AIs yet. Create your first AI below.</div>';
        } else {
            j.ais.forEach(ai => {
                const card = document.createElement("div");
                card.className = "ai-card" + (ai.active ? " active" : "");

                const img = document.createElement("img");
                img.className = "avatar";
                img.src = ai.profile_photo || "profile/default.png";
                img.onerror = () => { img.src = "profile/default.png"; };

                const info = document.createElement("div");
                info.className = "info";

                const name = document.createElement("div");
                name.className = "name";
                name.innerText = ai.ai_name || "Unnamed AI";

                const status = document.createElement("div");
                status.className = "small";
                status.innerText = ai.setup_complete
                    ? (ai.active ? "Currently selected" : "Ready to chat")
                    : "Needs setup";

                info.append(name, status);

                const actions = document.createElement("div");
                actions.className = "ai-actions";

                const select = document.createElement("button");
                select.innerText = ai.setup_complete ? "Select" : "Continue Setup";
                select.onclick = () => selectAI(ai.ai_id, ai.setup_complete);
                actions.appendChild(select);

                // Keep Delete available, directly underneath Select, without covering the AI information.
                if (j.ais.length > 1) {
                    const del = document.createElement("button");
                    del.className = "danger";
                    del.innerText = "Delete";
                    del.onclick = () => removeAI(ai.ai_id);
                    actions.appendChild(del);
                }

                card.append(img, info, actions);
                list.appendChild(card);
            });
        }

        $("create").disabled = j.ais.length >= max;
        $("create").innerText = j.ais.length >= max ? "Maximum 3 AIs" : "+ Create New AI";
    } catch (e) {
        $("error").innerText = e.message;
        console.error(e);
    }
}

async function selectAI(id, ready) {
    try {
        await request("/api/ai/select", {ai_id:id});
        location.href = ready ? "index.html" : "setup.html";
    } catch (e) {
        $("error").innerText = e.message;
    }
}

async function createAI() {
    try {
        await request("/api/ai/create", {});
        location.href = "setup.html";
    } catch (e) {
        $("error").innerText = e.message;
    }
}

async function removeAI(id) {
    if (!confirm("Delete this AI and all of its conversations, memory and private photos?")) return;
    try {
        await request("/api/ai/delete", {ai_id:id});
        await load();
    } catch (e) {
        $("error").innerText = e.message;
    }
}

async function logout() {
    try {
        await request("/api/auth/logout", {});
    } finally {
        location.href = "login.html";
    }
}

load();
</script>
</body>
</html>
