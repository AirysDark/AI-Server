name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AAPK/app/**'
      - 'AAPK/gradle/**'
      - 'AAPK/gradlew'
      - 'AAPK/gradlew.bat'
      - 'AAPK/gradle.properties'
      - 'AAPK/build.gradle'
      - 'AAPK/settings.gradle'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        working-directory: AAPK
        run: |
          # The project contains an unrelated Kotlin-DSL template alongside
          # the actual Groovy build files. Use the Groovy configuration.
          rm -f settings.gradle.kts build.gradle.kts app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Copy APK to Apk folder
        run: |
          mkdir -p Apk
          cp AAPK/app/build/outputs/apk/debug/app-debug.apk Apk/app-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-server-android-debug
          path: Apk/app-debug.apk
          retention-days: 30

      - name: Commit updated APK
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Apk/app-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; no commit needed."
            exit 0
          fi
          git commit -m "build(android): update generated APK [skip ci]"
          git push
