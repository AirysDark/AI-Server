name: Stage 2 - Storage and Configuration Refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract storage and paths
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          impl = root / 'core' / 'server_impl.py'
          config = root / 'core' / 'config.py'
          storage = root / 'core' / 'storage.py'
          text = impl.read_text(encoding='utf-8')

          if '# STAGE2_STORAGE_REFACTORED' not in text:
              config.write_text('''"""Central AI Server configuration and filesystem paths."""
import os

PORT = 47823
PUBLIC_HOSTNAME = "ai-server.ddns.net"
PUBLIC_URL = f"http://{PUBLIC_HOSTNAME}:{PORT}/"
MDNS_HOSTNAME = "ai-server.ddns.net"
RECENT_CONTEXT_MESSAGES = 10
RELEVANT_MEMORY_LIMIT = 10
PROACTIVE_MIN_MINUTES = 10
PROACTIVE_MAX_MINUTES = 30
MAX_AIS_PER_ACCOUNT = 3

BASE_DIR = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
USERS_DIR = os.path.join(BASE_DIR, "users")
AUTH_FILE = os.path.join(BASE_DIR, "accounts.json")
SESSIONS_FILE = os.path.join(BASE_DIR, "sessions.json")
AIS_FILE = os.path.join(BASE_DIR, "ais.json")

os.makedirs(USERS_DIR, exist_ok=True)
''', encoding='utf-8')

              storage.write_text('''"""JSON persistence helpers used by the AI Server."""
import json
import os


def load_json(path, default):
    try:
        with open(path, "r", encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return default


def save_json(path, data):
    os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
    tmp = path + ".tmp"
    with open(tmp, "w", encoding="utf-8") as f:
        json.dump(data, f, indent=4, ensure_ascii=False)
    os.replace(tmp, path)
''', encoding='utf-8')

              path_block = re.compile(
                  r'\nPORT = 47823\nPUBLIC_HOSTNAME = .*?\nPUBLIC_URL = .*?\nMDNS_HOSTNAME = .*?\n'
                  r'RECENT_CONTEXT_MESSAGES = .*?\nRELEVANT_MEMORY_LIMIT = .*?\n'
                  r'PROACTIVE_MIN_MINUTES = .*?\nPROACTIVE_MAX_MINUTES = .*?\n'
                  r'MAX_AIS_PER_ACCOUNT = .*?\nBASE_DIR = .*?\nUSERS_DIR = .*?\n'
                  r'AUTH_FILE = .*?\nSESSIONS_FILE = .*?\nAIS_FILE = .*?\n'
                  r'os\.makedirs\(USERS_DIR, exist_ok=True\)\n', re.S)
              text, count = path_block.subn('\n# STAGE2_STORAGE_REFACTORED\n', text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate configuration/path block')

              storage_block = re.compile(
                  r'\ndef load_json\(path,default\):.*?\n    os\.replace\(tmp,path\)\n', re.S)
              text, count = storage_block.subn('\n', text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate JSON storage helpers')

              marker = 'from brain import think, learn_from_conversation\nfrom online_ai import ask_online\n'
              replacement = marker + 'from core.config import *\nfrom core.storage import load_json, save_json\n'
              if marker not in text:
                  raise SystemExit('Could not locate import block')
              text = text.replace(marker, replacement, 1)
              impl.write_text(text, encoding='utf-8')

          # Keep generated bytecode and editor artifacts out of the repository.
          for p in root.rglob('__pycache__'):
              if p.is_dir():
                  import shutil
                  shutil.rmtree(p, ignore_errors=True)

          gitignore = root / '.gitignore'
          existing = gitignore.read_text(encoding='utf-8') if gitignore.exists() else ''
          additions = ['__pycache__/', '*.py[cod]', '.pytest_cache/']
          lines = existing.splitlines()
          for item in additions:
              if item not in lines:
                  lines.append(item)
          gitignore.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

      - name: Validate
        run: |
          python -m py_compile server.py core/server_impl.py core/config.py core/storage.py wsgi.py chats_api.py
          python - <<'PY'
          import server
          import wsgi
          assert server.AIHandler is not None
          assert server.PORT == 47823
          assert wsgi.application is not None
          print('Stage 2 validation OK')
          PY

      - name: Commit stage 2
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Stage 2 already applied"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/config.py core/storage.py core/server_impl.py .gitignore
          git commit -m 'Complete stage 2 storage and configuration refactor'
          git push
