<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI - Multiple Chat Room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:850px;margin:2vh auto}.card{background:#181820;border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:12px}h1{margin:4px 0 8px;font-size:30px}.muted{color:#aaa}.top,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer}.secondary{background:#444}.danger{background:#7a3333}.participants{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}.ai-choice{background:#111118;border:1px solid #333;border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center}.ai-choice input{width:18px;height:18px;accent-color:#ff5c9a}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #ff77aa}.chat{height:55vh;min-height:320px;overflow-y:auto;background:#0d0d12;border:1px solid #333;border-radius:12px;padding:12px;margin-top:12px}.msg{margin:8px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#30202a;margin-left:10%}.ai{background:#202027;margin-right:10%}.who{font-size:12px;color:#ff82b2;font-weight:bold;margin-bottom:4px}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{flex:1;resize:vertical;min-height:52px;background:#111118;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;font:inherit}.error{color:#ff7777;margin-top:10px}.live{color:#62df9a;font-size:13px;margin-top:6px}.live.offline{color:#ff7777}.typing{display:flex;align-items:center;gap:8px;color:#aaa;font-size:14px;padding:8px 12px;margin-top:8px}.typing .dots{display:flex;gap:3px}.typing .dot{width:6px;height:6px;border-radius:50%;background:#ff77aa;animation:typingDot 1.2s infinite ease-in-out}.typing .dot:nth-child(2){animation-delay:.15s}.typing .dot:nth-child(3){animation-delay:.3s}@keyframes typingDot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}.hidden{display:none}@media(max-width:600px){.compose{flex-direction:column}.user,.ai{margin-left:0;margin-right:0}.actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1 id="roomHeading">Multiple Chat</h1>
  <div id="roomMeta" class="muted">Loading conversation...</div>
  <div id="liveStatus" class="live">● Live updates enabled</div>
  <div class="top"><button onclick="location.href='multi_chat.html'">← Conversations</button><button class="secondary" onclick="location.href='select_ai.html'">Select Your AI</button></div>
</div>
<div class="card">
  <h2>Participants</h2>
  <div class="muted">Choose which of your AIs participate. At least one AI must remain.</div>
  <div id="participants" class="participants"></div>
  <div class="actions"><button onclick="saveParticipants()">Save Participants</button><button class="secondary" onclick="renameCurrent()">Rename</button><button class="danger" onclick="deleteCurrent()">Delete</button></div>
</div>
<div class="card">
  <h2>Conversation</h2>
  <div id="chat" class="chat"></div>
  <div id="typingIndicator" class="typing hidden" aria-live="polite"><span id="typingText">AI is typing...</span><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
  <div class="compose"><textarea id="message" placeholder="Talk to the participating AIs..."></textarea><button onclick="sendMessage()">Send</button></div>
  <div class="actions"><button onclick="aiTalk()">Let AIs Talk</button></div>
  <div id="error" class="error"></div>
</div>
</div>
<script>
let state={room:null,ais:[]};
let loading=false;
let pollTimer=null;
let lastSignature='';
const POLL_MS=1200;
const $=id=>document.getElementById(id);
async function api(path,body,method='POST'){const r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers:method==='POST'?{'Content-Type':'application/json'}:undefined,body:method==='POST'?JSON.stringify(body||{}):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
function esc(v){const d=document.createElement('div');d.innerText=v??'';return d.innerHTML}
function cid(){return new URLSearchParams(location.search).get('conversation')||''}
function signature(room){return JSON.stringify({updated:room?.updated||0,ais:room?.ais||[],count:room?.conversation?.length||0,last:room?.conversation?.slice(-1)[0]?.time||0})}
function selectedAiNames(){const selected=new Set(state.room?.ais||[]);return state.ais.filter(ai=>selected.has(ai.ai_id)).map(ai=>ai.ai_name)}
function setTyping(show,names=[]){const indicator=$('typingIndicator');if(!indicator)return;if(!show){indicator.classList.add('hidden');return}const clean=names.filter(Boolean);$('typingText').innerText=clean.length===1?`${clean[0]} is typing...`:clean.length>1?`${clean.join(', ')} are typing...`:'AI is typing...';indicator.classList.remove('hidden');const chat=$('chat');chat.scrollTop=chat.scrollHeight}
async function load(initial=false){try{if(!cid()){location.href='multi_chat.html';return}const all=initial?await api('/api/multi-chats',null,'GET'):null;if(all)state.ais=all.ais||[];const j=await api('/api/multi-chats/open?conversation_id='+encodeURIComponent(cid()),null,'GET');const next=j.room;const changed=signature(next)!==lastSignature;if(initial||changed){state.room=next;lastSignature=signature(next);render();}setLive(true)}catch(e){setLive(false);if(initial)$('error').innerText=e.message}}
function render(){if(!state.room)return;$('roomHeading').innerText=state.room.title||'Multiple Chat';$('roomMeta').innerText=`${state.room.ais.length} AI${state.room.ais.length===1?'':'s'} · ${state.room.conversation_id}`;renderParticipants();renderConversation()}
function renderParticipants(){const selected=new Set(state.room.ais);$('participants').innerHTML=state.ais.map(ai=>`<label class="ai-choice"><input type="checkbox" value="${ai.ai_id}" ${selected.has(ai.ai_id)?'checked':''}><img class="avatar" src="${ai.profile_photo||'profile/default.png'}" onerror="this.src='profile/default.png'"><span>${esc(ai.ai_name)}</span></label>`).join('')}
function renderConversation(){const el=$('chat');const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.innerHTML=state.room.conversation.map(x=>x.type==='user'?`<div class="msg user"><div class="who">You</div>${esc(x.text)}</div>`:`<div class="msg ai"><div class="who">${esc(x.ai_name)}${x.mode==='ai_to_ai'?' · AI to AI':''}</div>${esc(x.text)}</div>`).join('');if(atBottom)el.scrollTop=el.scrollHeight}
function setLive(ok){$('liveStatus').className=ok?'live':'live offline';$('liveStatus').innerText=ok?'● Live updates enabled':'● Reconnecting...'}
async function saveParticipants(){const ids=[...document.querySelectorAll('#participants input:checked')].map(x=>x.value);if(!ids.length){alert('At least one AI must remain.');return}try{const j=await api('/api/multi-chats/participants',{conversation_id:state.room.conversation_id,ais:ids});state.room=j.room;lastSignature=signature(state.room);render()}catch(e){$('error').innerText=e.message}}
async function sendMessage(){if(loading)return;const input=$('message'),text=input.value.trim();if(!text)return;input.value='';loading=true;setTyping(true,selectedAiNames());try{const j=await api('/api/multi-chats/message',{conversation_id:state.room.conversation_id,message:text});state.room=j.room;lastSignature=signature(state.room);render()}catch(e){$('error').innerText=e.message}finally{loading=false;setTyping(false)}}
async function aiTalk(){if(loading)return;loading=true;setTyping(true,selectedAiNames());try{const j=await api('/api/multi-chats/talk',{conversation_id:state.room.conversation_id});state.room=j.room;lastSignature=signature(state.room);render()}catch(e){$('error').innerText=e.message}finally{loading=false;setTyping(false)}}
async function renameCurrent(){const title=prompt('Conversation name:',state.room?.title||'');if(title===null)return;try{await api('/api/multi-chats/rename',{conversation_id:state.room.conversation_id,title});await load(true)}catch(e){alert(e.message)}}
async function deleteCurrent(){if(!confirm('Delete this multiple-chat conversation?'))return;try{await api('/api/multi-chats/delete',{conversation_id:state.room.conversation_id});stopPolling();location.href='multi_chat.html'}catch(e){alert(e.message)}}
async function poll(){if(document.hidden||loading)return;await load(false)}
function startPolling(){stopPolling();pollTimer=setInterval(poll,POLL_MS)}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPolling();else{poll();startPolling()}});
window.addEventListener('beforeunload',stopPolling);
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
(async()=>{await load(true);startPolling()})();
</script>
</body>
</html>
