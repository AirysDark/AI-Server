<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI - Multiple Chat Room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:850px;margin:2vh auto}.card{background:#181820;border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:12px}h1{margin:4px 0 8px;font-size:30px}.muted{color:#aaa}.top,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer}.secondary{background:#444}.danger{background:#7a3333}.participants{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}.ai-choice{background:#111118;border:1px solid #333;border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center}.ai-choice input{width:18px;height:18px;accent-color:#ff5c9a}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #ff77aa}.chat{height:55vh;min-height:320px;overflow-y:auto;background:#0d0d12;border:1px solid #333;border-radius:12px;padding:12px;margin-top:12px}.msg{margin:8px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#30202a;margin-left:10%}.ai{background:#202027;margin-right:10%}.who{font-size:12px;color:#ff82b2;font-weight:bold;margin-bottom:4px}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{flex:1;resize:vertical;min-height:52px;background:#111118;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;font:inherit}.error{color:#ff7777;margin-top:10px}.hidden{display:none}@media(max-width:600px){.compose{flex-direction:column}.user,.ai{margin-left:0;margin-right:0}.actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1 id="roomHeading">Multiple Chat</h1>
  <div id="roomMeta" class="muted">Loading conversation...</div>
  <div class="top"><button onclick="location.href='multi_chat.html'">← Conversations</button><button class="secondary" onclick="location.href='select_ai.html'">Select Your AI</button></div>
</div>
<div class="card">
  <h2>Participants</h2>
  <div class="muted">Choose which of your AIs participate. At least one AI must remain.</div>
  <div id="participants" class="participants"></div>
  <div class="actions"><button onclick="saveParticipants()">Save Participants</button><button class="secondary" onclick="renameCurrent()">Rename</button><button class="danger" onclick="deleteCurrent()">Delete</button></div>
</div>
<div class="card">
  <h2>Conversation</h2>
  <div id="chat" class="chat"></div>
  <div class="compose"><textarea id="message" placeholder="Talk to the participating AIs..."></textarea><button onclick="sendMessage()">Send</button></div>
  <div class="actions"><button onclick="aiTalk()">Let AIs Talk</button></div>
  <div id="error" class="error"></div>
</div>
</div>
<script>
let state={room:null,ais:[]};
const $=id=>document.getElementById(id);
async function api(path,body,method='POST'){const r=await fetch(path,{method,credentials:'same-origin',headers:method==='POST'?{'Content-Type':'application/json'}:undefined,body:method==='POST'?JSON.stringify(body||{}):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
function esc(v){const d=document.createElement('div');d.innerText=v??'';return d.innerHTML}
function cid(){return new URLSearchParams(location.search).get('conversation')||''}
async function load(){try{if(!cid()){location.href='multi_chat.html';return}const all=await api('/api/multi-chats',null,'GET');state.ais=all.ais||[];const j=await api('/api/multi-chats/open?conversation_id='+encodeURIComponent(cid()),null,'GET');state.room=j.room;render();}catch(e){$('error').innerText=e.message}}
function render(){if(!state.room)return;$('roomHeading').innerText=state.room.title||'Multiple Chat';$('roomMeta').innerText=`${state.room.ais.length} AI${state.room.ais.length===1?'':'s'} · ${state.room.conversation_id}`;renderParticipants();renderConversation()}
function renderParticipants(){const selected=new Set(state.room.ais);$('participants').innerHTML=state.ais.map(ai=>`<label class="ai-choice"><input type="checkbox" value="${ai.ai_id}" ${selected.has(ai.ai_id)?'checked':''}><img class="avatar" src="${ai.profile_photo||'profile/default.png'}" onerror="this.src='profile/default.png'"><span>${esc(ai.ai_name)}</span></label>`).join('')}
function renderConversation(){const el=$('chat');el.innerHTML=state.room.conversation.map(x=>x.type==='user'?`<div class="msg user"><div class="who">You</div>${esc(x.text)}</div>`:`<div class="msg ai"><div class="who">${esc(x.ai_name)}${x.mode==='ai_to_ai'?' · AI to AI':''}</div>${esc(x.text)}</div>`).join('');el.scrollTop=el.scrollHeight}
async function saveParticipants(){const ids=[...document.querySelectorAll('#participants input:checked')].map(x=>x.value);if(!ids.length){alert('At least one AI must remain.');return}try{const j=await api('/api/multi-chats/participants',{conversation_id:state.room.conversation_id,ais:ids});state.room=j.room;render()}catch(e){$('error').innerText=e.message}}
async function sendMessage(){const input=$('message'),text=input.value.trim();if(!text)return;input.value='';try{const j=await api('/api/multi-chats/message',{conversation_id:state.room.conversation_id,message:text});state.room=j.room;render()}catch(e){$('error').innerText=e.message}}
async function aiTalk(){try{const j=await api('/api/multi-chats/talk',{conversation_id:state.room.conversation_id});state.room=j.room;render()}catch(e){$('error').innerText=e.message}}
async function renameCurrent(){const title=prompt('Conversation name:',state.room?.title||'');if(title===null)return;try{await api('/api/multi-chats/rename',{conversation_id:state.room.conversation_id,title});await load()}catch(e){alert(e.message)}}
async function deleteCurrent(){if(!confirm('Delete this multiple-chat conversation?'))return;try{await api('/api/multi-chats/delete',{conversation_id:state.room.conversation_id});location.href='multi_chat.html'}catch(e){alert(e.message)}}
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});load();
</script>
</body>
</html>
