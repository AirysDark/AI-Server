<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI - Multiple Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:850px;margin:2vh auto}.card{background:#181820;border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:12px}h1{margin:4px 0 8px;font-size:30px}.muted{color:#aaa}.top{display:flex;gap:8px;flex-wrap:wrap}.top button{flex:1;min-width:130px}button{background:#ff5c9a;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer}.secondary{background:#444}.danger{background:#7a3333}.room{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111118;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0}.room-info{min-width:0}.room-title{font-weight:bold;font-size:17px;overflow-wrap:anywhere}.room-meta{font-size:12px;color:#aaa;margin-top:4px}.room-actions{display:flex;gap:6px;flex-wrap:wrap}.error{color:#ff7777;margin-top:10px}.empty{text-align:center;color:#aaa;padding:20px}@media(max-width:600px){.room{align-items:flex-start;flex-direction:column}.room-actions{width:100%}.room-actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1>Multiple Chat</h1>
  <div class="muted">Create separate conversations and choose which of your AIs participate. This does not change your normal single-AI chats.</div>
  <div class="top" style="margin-top:14px"><button onclick="newRoom()">+ New Conversation</button><button class="secondary" onclick="location.href='select_ai.html'">Select Your AI</button></div>
  <div id="error" class="error"></div>
</div>
<div class="card">
  <h2>Conversations</h2>
  <div id="rooms"></div>
</div>
</div>
<script>
let rooms=[];
const $=id=>document.getElementById(id);
async function api(path,body,method='POST'){const r=await fetch(path,{method,credentials:'same-origin',headers:method==='POST'?{'Content-Type':'application/json'}:undefined,body:method==='POST'?JSON.stringify(body||{}):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
function esc(v){const d=document.createElement('div');d.innerText=v??'';return d.innerHTML}
async function load(){try{const j=await api('/api/multi-chats',null,'GET');rooms=j.rooms||[];render()}catch(e){$('error').innerText=e.message}}
function render(){const el=$('rooms');if(!rooms.length){el.innerHTML='<div class="empty">No multiple-chat conversations yet.</div>';return}el.innerHTML=rooms.map(r=>`<div class="room"><div class="room-info"><div class="room-title">${esc(r.title)}</div><div class="room-meta">${r.ais.length} AI${r.ais.length===1?'':'s'} · ${esc(r.conversation_id)}</div></div><div class="room-actions"><button onclick="openRoom('${r.conversation_id}')">Open</button><button class="secondary" onclick="renameRoom('${r.conversation_id}')">Rename</button><button class="danger" onclick="deleteRoom('${r.conversation_id}')">Delete</button></div></div>`).join('')}
async function newRoom(){try{const j=await api('/api/multi-chats/new',{});location.href='multi_chat_room.html?conversation='+encodeURIComponent(j.room.conversation_id)}catch(e){alert(e.message)}}
function openRoom(cid){location.href='multi_chat_room.html?conversation='+encodeURIComponent(cid)}
async function renameRoom(cid){const room=rooms.find(x=>x.conversation_id===cid);const title=prompt('Conversation name:',room?.title||'');if(title===null)return;try{await api('/api/multi-chats/rename',{conversation_id:cid,title});await load()}catch(e){alert(e.message)}}
async function deleteRoom(cid){if(!confirm('Delete this multiple-chat conversation?'))return;try{await api('/api/multi-chats/delete',{conversation_id:cid});await load()}catch(e){alert(e.message)}}
load();
</script>
</body>
</html>
